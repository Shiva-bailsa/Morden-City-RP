<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>GameHub | Game Downloads</title>
<meta name="description" content="GameHub - discover and download games.">
<style>
:root{--bg:#080b12;--panel:#111722;--panel2:#151d2a;--line:#253044;--text:#f4f7fb;--muted:#91a0b5;--accent:#7c5cff;--accent2:#5d8bff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -10%,#182044 0,#080b12 42%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;background:rgba(8,11,18,.86);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.07)}
.logo{font-size:24px;font-weight:900;letter-spacing:-.7px}.logo span{color:var(--accent)}.admin{color:#b5c0d0;text-decoration:none;font-size:14px}.admin:hover{color:#fff}
.hero{max-width:1000px;margin:auto;text-align:center;padding:76px 20px 42px}.eyebrow{display:inline-block;padding:7px 12px;border:1px solid #303b55;border-radius:99px;color:#aebcff;background:#10162a;font-size:12px;font-weight:700}.hero h1{font-size:clamp(42px,9vw,76px);line-height:.98;letter-spacing:-3px;margin:18px 0 16px}.hero h1 span{background:linear-gradient(90deg,#9c7cff,#6ca7ff);-webkit-background-clip:text;color:transparent}.hero p{max-width:650px;margin:0 auto;color:var(--muted);font-size:16px;line-height:1.6}
.search{max-width:680px;margin:28px auto 0;position:relative}.search input{width:100%;padding:16px 18px 16px 48px;border-radius:15px;border:1px solid var(--line);background:rgba(17,23,34,.9);color:#fff;outline:none;font-size:15px}.search input:focus{border-color:#596bff;box-shadow:0 0 0 4px rgba(124,92,255,.12)}.search span{position:absolute;left:17px;top:14px;font-size:19px}
.wrap{width:90%;max-width:1180px;margin:auto;padding:12px 0 70px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px}.toolbar button{border:1px solid var(--line);background:#111722;color:#9eabbd;padding:9px 15px;border-radius:999px;cursor:pointer}.toolbar button.active,.toolbar button:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}.game{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#121a26,#0f151f);transition:.2s transform,.2s border-color}.game:hover{transform:translateY(-3px);border-color:#475a7d}.cover{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#1b2330}.content{padding:15px}.game h2{font-size:19px;margin:0 0 7px}.meta{font-size:12px;color:#8493a8;margin-bottom:10px}.desc{font-size:13px;color:#a9b4c3;line-height:1.5;min-height:39px}.download{display:block;text-align:center;margin-top:14px;padding:12px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;text-decoration:none;font-weight:800;font-size:14px}.stats{margin-top:9px;text-align:center;font-size:11px;color:#69778c}.empty{grid-column:1/-1;text-align:center;padding:70px 10px;color:#718096}
footer{border-top:1px solid rgba(255,255,255,.07);padding:25px 5%;text-align:center;color:#637085;font-size:12px}
@media(max-width:600px){header{height:62px;padding:0 5%}.logo{font-size:21px}.hero{padding-top:58px}.hero h1{letter-spacing:-2px}.wrap{width:92%}.games{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo">Game<span>Hub</span></div><a class="admin" href="admin.html">Admin Panel ↗</a></header>
<section class="hero">
  <div class="eyebrow">🎮 GAMING DOWNLOAD HUB</div>
  <h1>Find your next <span>game.</span></h1>
  <p>Browse the GameHub library, filter by platform, and open the official download link for each listed game.</p>
  <div class="search"><span>⌕</span><input id="search" autocomplete="off" placeholder="Search games, platforms, descriptions..."></div>
</section>
<main class="wrap">
  <div id="filters" class="toolbar"></div>
  <div id="games" class="games"></div>
</main>
<footer>© 2026 GameHub · Built for GitHub Pages</footer>
<script>
const placeholder="https://placehold.co/1000x625/151c29/eef2ff?text=GAME+COVER";
const seed=[
 {name:"My First Game",category:"Android",version:"1.0",size:"120 MB",description:"Example Android game. Replace this entry with your own game.",cover:placeholder,download:"#",downloads:0},
 {name:"Demo PC Game",category:"PC",version:"1.0",size:"850 MB",description:"Example PC game. Add the real download link from the Admin Panel.",cover:placeholder,download:"#",downloads:0}
];
if(!localStorage.getItem("gamehub_games")) localStorage.setItem("gamehub_games",JSON.stringify(seed));
let games=JSON.parse(localStorage.getItem("gamehub_games")||"[]"),cat="All";
const $=id=>document.getElementById(id);
function save(){localStorage.setItem("gamehub_games",JSON.stringify(games))}
function categories(){
  const cats=["All",...new Set(games.map(g=>g.category).filter(Boolean))];
  $("filters").innerHTML=cats.map(x=>`<button class="${x===cat?"active":""}" data-cat="${escapeHtml(x)}">${escapeHtml(x)}</button>`).join("");
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;categories();render()});
}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function safeUrl(url){try{let u=new URL(url,location.href);return ["http:","https:"].includes(u.protocol)?u.href:"#"}catch{return "#"}}
function render(){
  const q=$("search").value.toLowerCase().trim();
  const list=games.filter(g=>(cat==="All"||g.category===cat)&&`${g.name} ${g.description} ${g.category}`.toLowerCase().includes(q));
  $("games").innerHTML=list.length?list.map(g=>{
    const i=games.indexOf(g);
    return `<article class="game"><img class="cover" src="${safeUrl(g.cover||placeholder)}" alt="${escapeHtml(g.name)} cover" loading="lazy">
    <div class="content"><h2>${escapeHtml(g.name)}</h2><div class="meta">${escapeHtml(g.category||"Game")} · v${escapeHtml(g.version||"1.0")} · ${escapeHtml(g.size||"Size N/A")}</div>
    <div class="desc">${escapeHtml(g.description||"Game download")}</div>
    <a class="download" href="${safeUrl(g.download)}" target="_blank" rel="noopener noreferrer" data-download="${i}">⬇ Download</a>
    <div class="stats">${g.downloads||0} downloads</div></div></article>`;
  }).join(""):`<div class="empty">No games found. Try another search or category.</div>`;
  document.querySelectorAll("[data-download]").forEach(a=>a.onclick=()=>{const i=Number(a.dataset.download);games[i].downloads=(games[i].downloads||0)+1;save()});
}
$("search").addEventListener("input",render);categories();render();
</script>
</body></html>
